# XcodeGen spec for the iOS app. On the Mac:
#   brew install xcodegen
#   xcodegen generate
#   open TodayIs.xcodeproj      # then Cmd-R
#
# Regenerate whenever you add source files. The .xcodeproj is disposable (gitignored).
# Logic tests run separately from the repo root with `swift test`.

name: TodayIs
options:
  bundleIdPrefix: com.tylerdrake
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TodayIs:
    type: application
    platform: iOS
    sources:
      - path: TodayIs
        excludes:
          - "README.md"
          - "Resources/Assets.xcassets/AppIcon.appiconset/README.txt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerdrake.todayis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: TodayIs
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
